apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  namespace: lab
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: lab.seanneol.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: lab, port: {number: 8080}}
    - host: seanneol.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: lab, port: {number: 8080}}
    - host: www.seanneol.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: lab, port: {number: 8080}}
